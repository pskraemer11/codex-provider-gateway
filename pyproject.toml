[project]
name = "opencode-go-proxy"
version = "0.4.10"
description = "Codex Provider Gateway with OpenCode Go/Zen routing and a quality-price model picker"
readme = "README.md"
authors = [{ name = "Kartik Kabadi", email = "1kartikkabadi1@gmail.com" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.22"]
keywords = ["codex", "codex-picker", "provider-gateway", "opencode", "responses-api", "chat-completions", "agent", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/pskraemer11/codex-provider-gateway"
Repository = "https://github.com/pskraemer11/codex-provider-gateway"
Issues = "https://github.com/pskraemer11/codex-provider-gateway/issues"

[project.scripts]
opencode-go-proxy = "opencode_go_proxy.app:main"

[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = ".ruff_cache"
required-version = "==0.17.3"
extend-exclude = ["Qwen3*.py", "staging", "pytest/artifacts"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
